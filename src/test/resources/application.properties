spring.application.name=Hostel-Flow-Test

spring.datasource.url=jdbc:h2:mem:hostelflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

jwt.secret=test-secret-key-only-used-in-tests-not-for-production-0123456789
jwt.expiration-ms=600000
